<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patriot Marketing Arcade | The 4 P's</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18314e;background:#edf4fb}*{box-sizing:border-box}body{margin:0;padding:20px}.shell{max-width:720px;margin:auto;background:white;border-radius:18px;box-shadow:0 12px 36px #153e6b22;overflow:hidden}header{background:#2a71b9;color:white;padding:28px;text-align:center}header small{letter-spacing:2px;font-weight:bold}h1{margin:10px 0;font-size:clamp(25px,5vw,38px)}header p{margin:0;color:#e8f4ff}.content{padding:26px}.stats{display:flex;justify-content:space-between;font-weight:bold;gap:10px}.track{background:#dce9f6;height:10px;border-radius:20px;margin:17px 0 25px;overflow:hidden}.fill{height:100%;width:0;background:#2a71b9;transition:width .2s}h2{font-size:22px;line-height:1.4}button{font:inherit;cursor:pointer}.answer{display:block;width:100%;text-align:left;background:#f4f8fc;border:2px solid #d7e4f1;border-radius:10px;padding:16px;margin:11px 0;color:#18314e}.answer:hover:not(:disabled),.answer:focus-visible{border-color:#2a71b9;background:#e9f3ff}.answer:disabled{cursor:default;opacity:1}.answer.correct{background:#ddf6e6;border-color:#168246}.answer.wrong{background:#ffe8e8;border-color:#c33a3a}.feedback{min-height:55px;line-height:1.5;font-weight:bold;margin-top:15px}.next{border:0;background:#2a71b9;color:white;padding:14px 24px;border-radius:9px;font-weight:bold}.next:hover{background:#18568f}.hidden{display:none}.result{text-align:center;padding:24px 0}.result strong{font-size:54px;color:#2a71b9}.foot{text-align:center;font-size:12px;color:#58718d;padding:0 20px 20px}@media(max-width:500px){body{padding:8px}.content{padding:18px}header{padding:22px 12px}}
</style></head><body><main class="shell"><header><small>PATRIOT MARKETING ARCADE</small><h1>THE 4 P'S CHALLENGE</h1><p>Product • Price • Place • Promotion</p></header><section class="content" aria-live="polite"><div id="play"><div class="stats"><span id="count">Question 1 of 8</span><span id="score">Score: 0</span></div><div class="track"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback" role="status"></div><button class="next hidden" id="next">Next Question →</button></div><div class="result hidden" id="result"><h2>Challenge Complete!</h2><strong id="finalScore"></strong><p id="message"></p><button class="next" id="restart">Play Again ↻</button></div></section><div class="foot">Practice activity only • Scores are not submitted to Schoology</div></main><script>
const questions=[
{q:'Nike launches a new running shoe with extra cushioning. Which P?',a:['Price','Product','Place','Promotion'],c:1,why:'Product covers the goods, services, and features a business offers.'},
{q:'A fast-food restaurant introduces a $5 meal deal. Which P?',a:['Product','Promotion','Price','Place'],c:2,why:'Price is the amount customers pay.'},
{q:'A clothing brand begins selling through an online store. Which P?',a:['Place','Price','Product','Promotion'],c:0,why:'Place describes where and how customers can buy a product.'},
{q:'Coca-Cola buys an advertisement during a major sporting event. Which P?',a:['Place','Product','Price','Promotion'],c:3,why:'Promotion communicates the product’s value to customers.'},
{q:'Apple improves the camera on its latest phone. Which P?',a:['Promotion','Place','Product','Price'],c:2,why:'Changing product features is a Product decision.'},
{q:'A sneaker shop opens a second location at the mall. Which P?',a:['Price','Place','Promotion','Product'],c:1,why:'Choosing store locations is a Place decision.'},
{q:'A company pays a popular athlete to endorse its shoes. Which P?',a:['Promotion','Product','Price','Place'],c:0,why:'An endorsement is a form of Promotion.'},
{q:'A store lists an item at $19.99 instead of $20. Which P?',a:['Product','Place','Promotion','Price'],c:3,why:'Psychological pricing is a Price strategy.'}
];let index=0,points=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;let item=questions[index];$('count').textContent=`Question ${index+1} of ${questions.length}`;$('score').textContent=`Score: ${points}`;$('fill').style.width=`${index/questions.length*100}%`;$('question').textContent=item.q;$('answers').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');item.a.forEach((answer,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=`${'ABCD'[i]}. ${answer}`;b.onclick=()=>choose(i);$('answers').append(b)})}function choose(i){if(answered)return;answered=true;let item=questions[index];if(i===item.c)points++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===item.c)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent=`Score: ${points}`;$('feedback').textContent=(i===item.c?'✓ Correct! ':'Not quite. ')+item.why;$('next').textContent=index===questions.length-1?'See Results →':'Next Question →';$('next').classList.remove('hidden')}function next(){index++;if(index<questions.length){show();return}$('play').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${points} / ${questions.length}`;$('message').textContent=points===8?'Perfect score! Marketing mix master.':points>=6?'Great work! You know your marketing mix.':points>=4?'Good start! Review the 4 P’s and try again.':'Keep practicing! You can improve your score.'}function restart(){index=0;points=0;$('play').classList.remove('hidden');$('result').classList.add('hidden');show()}$('next').addEventListener('click',next);$('restart').addEventListener('click',restart);show();
</script></body></html>
